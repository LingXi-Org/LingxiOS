name: publish-package

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require the tagged version and successful main package build
        uses: actions/github-script@v7
        with:
          script: |
            const { name, version, publishConfig } = require('./package.json')
            if (context.repo.owner.toLowerCase() !== 'lingxi-org' || name !== '@lingxi-org/lingxios' || publishConfig?.registry !== 'https://npm.pkg.github.com') {
              throw new Error('Publish only @lingxi-org/lingxios to GitHub Packages')
            }
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || publishConfig.tag !== 'latest') {
              throw new Error('Publish only stable X.Y.Z versions with the latest tag')
            }
            if (context.ref !== `refs/tags/v${version}`) throw new Error('Tag does not match package version')
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'release.yml',
              branch: 'main', event: 'push', head_sha: context.sha, per_page: 100,
            })
            if (!runs.data.workflow_runs.some(run => run.head_sha === context.sha && run.conclusion === 'success')) {
              throw new Error('This exact commit has no successful main package build')
            }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci --ignore-scripts
      - run: npm publish --access public --registry=https://npm.pkg.github.com --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
