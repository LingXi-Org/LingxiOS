name: package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm pack
      - run: node --test scripts/test-public-answer-publication.mjs scripts/test-explanation-stage-replacement.mjs scripts/test-answer-candidate-lineage.mjs scripts/test-correction-candidate-view.mjs scripts/test-explanation-stage-references.mjs scripts/test-public-answer-order.mjs scripts/test-runtime-failure-paths.mjs
      - name: Verify production package imports and resources
        run: |
          package="$PWD/$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          cd "$(mktemp -d)"
          npm init -y
          npm install --ignore-scripts --omit=dev "$package"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { access, readFile } from 'node:fs/promises'
          import { createLingxiOS, packageResources } from '@lingxi-org/lingxios'
          import { createWorker } from '@lingxi-org/lingxios/worker'
          import * as ui from '@lingxi-org/lingxios/ui'
          import { gradeResources } from '@lingxi-org/lingxios/eval'
          assert.equal(typeof createLingxiOS, 'function')
          assert.equal(typeof createWorker, 'function')
          assert.ok(Object.keys(ui).length)
          assert.deepEqual(gradeResources(1, [{ id: 'check', resource: 'resource', expected: true }],
            [{ resource: 'resource', requestVersion: 1, value: true }]), [{ checkId: 'check', status: 'pass' }])
          const metadata = JSON.parse(await readFile('node_modules/@lingxi-org/lingxios/package.json', 'utf8'))
          assert.deepEqual(Object.keys(metadata.dependencies).sort(), ['@streamparser/json', 'ajv', 'ajv-formats'])
          assert.equal(metadata.peerDependencies, undefined)
          for (const parser of ['mammoth', 'pdfjs-dist']) assert.throws(() => import.meta.resolve(parser))
          await Promise.all(Object.values(packageResources()).map(path => access(path)))
          JS
