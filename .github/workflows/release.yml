name: package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm pack
      - run: node --test scripts/test-public-answer-publication.mjs
      - name: Verify production package imports and resources
        run: |
          package="$PWD/$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          cd "$(mktemp -d)"
          npm init -y
          npm install --ignore-scripts --omit=dev "$package"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { access } from 'node:fs/promises'
          import { createLingxiOS, packageResources } from '@lyyzka/lingxios'
          import { createWorker } from '@lyyzka/lingxios/worker'
          import * as ui from '@lyyzka/lingxios/ui'
          assert.equal(typeof createLingxiOS, 'function')
          assert.equal(typeof createWorker, 'function')
          assert.ok(Object.keys(ui).length)
          await Promise.all(Object.values(packageResources()).map(path => access(path)))
          JS
